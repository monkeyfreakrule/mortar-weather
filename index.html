<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mortar Rock Conditions</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
  body { font-family: -apple-system; margin:10px; background:#111; color:white; }
  h2 { text-align:center; margin-bottom:15px; }
  canvas { background:#1c1c1e; border-radius:10px; padding:10px; }
</style>
</head>
<body>

<h2>Mortar Rock: Hill vs Valley</h2>
<canvas id="chart"></canvas>

<script>
const hillStation = "KCABERKE243";
const valleyStation = "KCABERKE295";

// Proxy URL that returns JSON for the station
function proxyURL(station) {
  return `https://raw.githubusercontent.com/weather-api-proxy/station-proxy/main/${station}.json`;
}

async function fetchStation(station) {
  try {
    const res = await fetch(proxyURL(station));
    if (!res.ok) throw new Error("Network response not OK");

    const data = await res.json();
    if (!data.observations) return [];

    return data.observations.slice(-24);
  } catch (err) {
    console.error("Fetch error:", err);
    return [];
  }
}

function extractData(obs) {
  return {
    labels: obs.map(o => new Date(o.obsTimeLocal).getHours() + ":00"),
    temp: obs.map(o => o.imperial.temp),
    humidity: obs.map(o => o.humidity)
  };
}

async function init() {
  const hillObs = await fetchStation(hillStation);
  const valleyObs = await fetchStation(valleyStation);

  if (!hillObs.length || !valleyObs.length) {
    document.body.insertAdjacentHTML(
      "beforeend",
      "<p style='text-align:center;color:red'>⚠️ Failed to load station data</p>"
    );
    return;
  }

  const hill = extractData(hillObs);
  const valley = extractData(valleyObs);

  new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels: hill.labels,
      datasets: [
        {
          label: "Hill Temp (°F)",
          data: hill.temp,
          borderColor: "orange",
          yAxisID: "y1"
        },
        {
          label: "Valley Temp (°F)",
          data: valley.temp,
          borderColor: "red",
          borderDash: [5,5],
          yAxisID: "y1"
        },
        {
          label: "Hill Humidity (%)",
          data: hill.humidity,
          borderColor: "cyan",
          yAxisID: "y2"
        },
        {
          label: "Valley Humidity (%)",
          data: valley.humidity,
          borderColor: "blue",
          borderDash: [5,5],
          yAxisID: "y2"
        }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode:"index", intersect:false },
      scales: {
        y1: {
          type:"linear",
          position:"left",
          title:{display:true,text:"°F"},
        },
        y2: {
          type:"linear",
          position:"right",
          title:{display:true,text:"%"},
          grid:{drawOnChartArea:false}
        }
      }
    }
  });
}

init();
</script>

</body>
</html>
